name: Deploy Svelte to GitHub Pages

on:
  # Akan otomatis berjalan setiap kali Anda nge-push ke branch 'main'
  push:
    branches: ["main"]

# Memberikan izin kepada GitHub Actions untuk mengunggah ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah penumpukan proses jika Anda melakukan push berulang-ulang dengan cepat
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Menggunakan versi Node LTS
          cache: "npm"

      - name: Install dependencies
        run: npm ci # atau 'npm install' jika npm ci gagal

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (folder dist)
        uses: actions/upload-pages-artifact@v3
        with:
          # Pastikan ini menunjuk ke folder hasil build Vite Anda (biasanya 'dist')
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
